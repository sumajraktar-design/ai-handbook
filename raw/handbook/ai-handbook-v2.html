<title>AI 概念手册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 顶部主线条 + 左侧概念目录 / 右侧粘性详情面板（手机上堆叠） */
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --ink:#17202C; --muted:#5A6577; --faint:#8A94A5; --line:#DCE1E8;
  --accent:#2B58CF; --accent-soft:#E5EBFA;
  --c-base:#5B6B82; --c-arch:#2B58CF; --c-train:#7646C9; --c-deploy:#0F7F86; --c-app:#B35314; --c-agent:#A03A73; --c-frame:#2F7A3A; --c-safe:#B4302B;
  --code-bg:#F0F2F6; --ok:#2F7A3A; --ok-soft:#E3F1E5;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --panel:#151C26; --ink:#E5EAF1; --muted:#9AA6B7; --faint:#6E7A8C; --line:#28313E;
  --accent:#86A6FF; --accent-soft:#1C2742;
  --c-base:#9AA9BF; --c-arch:#86A6FF; --c-train:#B898F2; --c-deploy:#4FC5CB; --c-app:#F0985A; --c-agent:#E58BBE; --c-frame:#7FCB8A; --c-safe:#F07D77;
  --code-bg:#0F151E; --ok:#7FCB8A; --ok-soft:#18301D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --panel:#151C26; --ink:#E5EAF1; --muted:#9AA6B7; --faint:#6E7A8C; --line:#28313E;
  --accent:#86A6FF; --accent-soft:#1C2742;
  --c-base:#9AA9BF; --c-arch:#86A6FF; --c-train:#B898F2; --c-deploy:#4FC5CB; --c-app:#F0985A; --c-agent:#E58BBE; --c-frame:#7FCB8A; --c-safe:#F07D77;
  --code-bg:#0F151E; --ok:#7FCB8A; --ok-soft:#18301D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;padding:0 16px}
.wrap{max-width:1240px;margin:0 auto;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
header.top h1{font-size:34px;letter-spacing:.02em}
header.top p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}

/* 主线 */
.spine{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:22px}
.spine-h{font-size:12px;letter-spacing:.12em;color:var(--faint);margin-bottom:10px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 130px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:transparent;text-align:left;transition:border-color .2s,background .2s}
.flow .st:hover{border-color:var(--sc)}
.flow .st.on{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 10%,transparent)}
.flow .st b{display:block;font-weight:700;color:var(--sc);font-size:14px}
.flow .st span{font-size:12.5px;color:var(--muted);line-height:1.5;display:block;margin-top:2px}
.flow .ar{align-self:center;color:var(--faint);font-size:14px}
@media (max-width:720px){.flow .ar{display:none}.flow .st{flex-basis:45%}}

.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}

/* 目录 */
.toc{min-width:0}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.search kbd{font-family:var(--f-mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.grp{margin-bottom:18px}
.grp-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.grp-h h2{font-size:16px;color:var(--gc)}
.grp-h small{font-size:12px;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:13.5px;line-height:1.4;transition:border-color .15s}
.chip:hover{border-color:var(--gc)}
.chip.on{border-color:var(--gc);box-shadow:inset 0 0 0 1px var(--gc);color:var(--gc);font-weight:500}
.chip .pr{width:7px;height:7px;border-radius:50%;flex:none}
.pr.h{background:var(--c-safe)}.pr.m{background:#C98A1B}.pr.l{background:var(--faint)}
.chip.done{background:var(--ok-soft)}
.chip.done::after{content:"✓";font-size:11px;color:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:-4px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.empty{color:var(--faint);font-size:14px;padding:12px 0}

/* 详情 */
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 28px;min-width:0;max-height:calc(100vh - 28px);overflow:auto}
@media (max-width:900px){.detail{position:static;max-height:none;padding:22px 18px}}
.kick{font-size:12px;letter-spacing:.1em;color:var(--dc);font-weight:500}
.detail h2{font-size:30px;margin:4px 0 2px}
.en{font-family:var(--f-mono);font-size:13px;color:var(--faint)}
.lead{font-size:17px;line-height:1.7;margin:14px 0 4px;padding-left:14px;border-left:3px solid var(--dc)}
.detail h3{font-family:var(--f-body);font-size:13px;letter-spacing:.12em;color:var(--faint);font-weight:500;margin:22px 0 6px}
.detail p{margin:0 0 10px;max-width:68ch}
.detail ul{margin:0;padding-left:1.2em}
.detail li{margin:4px 0;max-width:66ch}
.analogy{background:color-mix(in srgb,var(--dc) 8%,transparent);border-radius:10px;padding:12px 14px;max-width:68ch}
.detail code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:12.5px;line-height:1.65;margin:0}
pre code{background:none;padding:0}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:13px}
.rel button:hover{border-color:var(--accent);color:var(--accent)}
.dfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.nav{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ok.is{background:var(--ok);color:var(--panel)}
figure{margin:0;overflow-x:auto}
figure svg{display:block;min-width:460px;width:100%;height:auto}
figure svg text{font-family:var(--f-body);fill:var(--ink)}
figure svg .s{fill:var(--muted);font-size:11px}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.cmp th{color:var(--muted);font-weight:500;font-size:12.5px}
.tbl{overflow-x:auto}
/* 动画演示 */
.chip .anim{font-size:9px;color:var(--gc);opacity:.8}
.vz{border:1px solid var(--line);border-radius:12px;padding:14px;background:color-mix(in srgb,var(--dc) 5%,var(--panel));display:grid;gap:10px;min-width:0}
.vz .vsvg{width:100%;height:auto;display:block}
.vz text{font-family:var(--f-body)}
.vz .ti{fill:var(--ink);font-size:13px}.vz .ts{fill:var(--ink);font-size:11px}.vz .tm{fill:var(--muted);font-size:11px}.vz .tw{fill:var(--panel);font-size:14px}
.vz .fp{fill:var(--panel)}.vz .fa{fill:var(--dc)}.vz .fa2{fill:color-mix(in srgb,var(--dc) 16%,var(--panel))}.vz .fb{fill:var(--c-arch)}.vz .fo{fill:var(--c-app)}.vz .fok{fill:var(--ok-soft)}.vz .fm{fill:var(--muted)}
.vz .sl{stroke:var(--line)}.vz .sm{stroke:var(--muted)}.vz .sa{stroke:var(--dc)}.vz .sr{stroke:var(--c-safe)}.vz .so{stroke:var(--c-app)}.vz .sok{stroke:var(--ok)}
.vrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vstat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.vstat b{color:var(--ink);font-weight:500}
.detail .vnote{font-size:13px;color:var(--muted);margin:0;line-height:1.65}
.vgrid{display:grid;grid-template-columns:auto minmax(0,1fr) 3em;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.vz input[type=range]{accent-color:var(--dc);width:100%}
.vz .btn.is{background:var(--dc);border-color:var(--dc);color:var(--panel)}
.vz .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px;vertical-align:middle}
.vz .dot.db{background:var(--c-arch)}.vz .dot.ring{border:2px solid var(--c-app)}
.vz .ed{transition:stroke .3s}.vz .ed.lit{stroke:var(--dc);stroke-width:1.6}.vz .ed.litr{stroke:var(--c-safe);stroke-width:1.6}
.vz .nd{transition:fill .3s}.vz .nd.lit{fill:var(--dc)}.vz .nd.litr{fill:var(--c-safe)}
.vz .fa2{transition:fill .25s}.vz .fa2.lit{fill:color-mix(in srgb,var(--dc) 45%,var(--panel))}
.vz .e{transition:stroke .25s}.vz .e.lit{stroke:var(--dc);stroke-width:2.5}
.vz .lgn rect{transition:fill .25s}.vz .lgn.lit rect{fill:color-mix(in srgb,var(--dc) 28%,var(--panel))}
.vz .pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;transition:all .25s}
.vz .pill.lit{background:var(--dc);border-color:var(--dc);color:var(--panel)}
.vcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.vpane{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);min-width:0}
.vph{font-size:12px;color:var(--faint);letter-spacing:.06em;margin-bottom:4px}
.vpt{min-height:5.5em;font-size:14px;line-height:1.7}
.vlog{display:grid;gap:6px}
.vlog .li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.6;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;animation:vin .3s ease-out}
.vlog .tag{font-size:11.5px;padding:1px 8px;border-radius:6px;white-space:nowrap;background:color-mix(in srgb,var(--tc,var(--dc)) 15%,transparent);color:var(--tc,var(--dc))}
@keyframes vin{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.vstate pre{font-size:12px}.vstate .chg{color:var(--dc);font-weight:500}
.tkn{display:inline-flex;flex-direction:column;align-items:center;margin:3px;padding:5px 9px;border-radius:7px;font-size:15px;animation:vin .3s ease-out both}
.tkn small{font-family:var(--f-mono);font-size:10.5px;opacity:.8}
.hbar{display:flex;align-items:center;gap:8px;font-size:13.5px}
.hbar .tr{flex:1;height:12px;border-radius:4px;background:var(--line);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--dc);transition:width .35s}
.hbar .nm{min-width:4.5em}.hbar .pc{min-width:3.5em;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.ck{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:13px;transition:opacity .4s,background .4s}
.ck.hit{border-color:var(--ok);background:var(--ok-soft)}.ck.miss{opacity:.4}
.ck .sc{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:2.6em}
.ck .tg2{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:6px;white-space:nowrap}
.ck.gone{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>AI 概念手册</h1>
      <p>从机器学习到 Agent 和 LangGraph，所有概念放在一页。点任意概念看详细讲解，带 ▶ 的概念有可以动手操作的动画演示。</p>
    </div>
    <div class="prog" aria-live="polite"><span>已掌握</span><div class="bar"><i id="pbar"></i></div><span id="ptxt">0 / 0</span></div>
  </header>

  <section class="spine" aria-label="主线">
    <div class="spine-h">一条主线串起全部概念 · 点击按阶段筛选</div>
    <div class="flow" id="flow"></div>
  </section>

  <div class="main">
    <nav class="toc" aria-label="概念目录">
      <label class="search" for="q"><span aria-hidden="true" style="color:var(--faint)">⌕</span><input id="q" type="search" placeholder="搜索概念，比如 注意力、RAG、LangGraph" autocomplete="off"><kbd>/</kbd></label>
      <div class="legend"><span><i class="pr h chip-dot" style="width:7px;height:7px;border-radius:50%;display:inline-block"></i>开发者必知</span><span><i class="pr m" style="width:7px;height:7px;border-radius:50%;display:inline-block"></i>很常见，要懂</span><span><i class="pr l" style="width:7px;height:7px;border-radius:50%;display:inline-block"></i>了解即可</span></div>
      <div id="groups"></div>
    </nav>
    <article class="detail" id="detail" aria-live="polite"></article>
  </div>
</div>

<script>
const GROUPS=[
 {id:'base',name:'基础原理',sub:'机器怎么"学"',color:'--c-base'},
 {id:'arch',name:'大模型结构',sub:'Transformer 和它的零件',color:'--c-arch'},
 {id:'train',name:'训练与对齐',sub:'一个模型怎么造出来',color:'--c-train'},
 {id:'deploy',name:'使用模型',sub:'推理、成本、部署',color:'--c-deploy'},
 {id:'app',name:'应用开发',sub:'提示词、RAG、上下文工程',color:'--c-app'},
 {id:'agent',name:'Agent 智能体',sub:'让模型动手干活',color:'--c-agent'},
 {id:'frame',name:'开发框架',sub:'LangChain、LangGraph 等',color:'--c-frame'},
 {id:'safe',name:'安全与风险',sub:'做产品必须考虑',color:'--c-safe'}];

const STAGES=[
 {name:'① 原理',desc:'机器怎么从数据中学',g:['base'],c:'--c-base'},
 {name:'② 结构',desc:'Transformer 大脑长什么样',g:['arch'],c:'--c-arch'},
 {name:'③ 训练',desc:'产出唯一成果：权重',g:['train'],c:'--c-train'},
 {name:'④ 推理',desc:'每次提问都在发生',g:['deploy'],c:'--c-deploy'},
 {name:'⑤ 上下文',desc:'决定模型能看见什么',g:['app'],c:'--c-app'},
 {name:'⑥ Agent',desc:'模型 + 工具 + 循环',g:['agent','frame'],c:'--c-agent'},
 {name:'贯穿全程',desc:'安全与风险',g:['safe'],c:'--c-safe'}];

/* 字段：g 分组, n 名称, e 英文, p 优先级, s 一句话, d 详细讲解段落, a 比喻, t 开发者要点, c 代码, f 图/表(HTML), r 相关 */
const C={
// ───── 基础原理
ai:{g:'base',n:'人工智能',e:'Artificial Intelligence, AI',p:'m',
 s:'让机器做"原本需要人类智能才能做的事"的所有技术的总称。',
 d:['AI 是一个范围很大的伞形概念。只要机器表现出看、听、说、推理、决策这类能力，都可以算 AI。它既包括 1950 年代就有的、人工写规则的"专家系统"，也包括今天的大语言模型。',
 '早期 AI 的主流做法是"符号主义"：由人把知识写成规则，比如"如果有尖耳朵且有胡须，就是猫"。这种方法在规则清楚的领域（下棋、简单诊断）有效，但现实世界的例外太多，规则永远写不完。',
 '后来的主流变成了"让机器从数据里自己学规律"，也就是机器学习。今天大家口中的 AI，绝大多数时候指的是机器学习里最新的一支：基于深度学习的大语言模型。'],
 a:'AI 就像"交通工具"这个词：自行车、汽车、飞机都算。机器学习是其中的"机动车"，深度学习是"汽车"，大语言模型是现在最火的"新能源车"。',
 t:['读文章时，先判断作者说的"AI"是指整个领域，还是特指大语言模型，很多争论都是因为这个词的范围不一致。','层级关系：AI ⊃ 机器学习 ⊃ 深度学习 ⊃ 大语言模型。'],
 r:['ml','dl','transformer']},
ml:{g:'base',n:'机器学习',e:'Machine Learning, ML',p:'h',
 s:'不写规则，而是给机器大量例子，让它自己总结出规律。',
 d:['传统编程是"人写规则 + 输入数据 → 得到答案"。机器学习反过来："输入数据 + 已知答案 → 机器自己得出规则"。学到的这套规则就叫"模型"。',
 '具体过程是：模型内部有很多可调节的数字（参数/权重），一开始是随机的，所以乱猜。每次猜完和正确答案比较，算出错了多少（损失），再把参数往"错得少一点"的方向微调（梯度下降）。重复几百万次后，参数停在一个好位置，模型就"学会"了。',
 '机器学习能解决的典型问题：分类（这封邮件是不是垃圾邮件）、回归（这套房子值多少钱）、聚类（把用户分成几群）、生成（写一段文字、画一张图）。'],
 a:'小孩认猫：没人给他规则手册，只是见过很多猫、被告诉"这是猫"，慢慢就会了。机器学习就是让电脑用同样的方式学习。',
 t:['机器学习的效果首先取决于数据：数据少、数据脏、数据有偏差，模型就学不好。业内常说"垃圾进，垃圾出"。','做 AI 应用开发一般不用自己训练模型，但理解训练过程能帮你判断模型为什么会犯某类错误。'],
 r:['supervised','loss','gd','overfit','dl']},
supervised:{g:'base',n:'监督 / 无监督 / 自监督',e:'Supervised / Unsupervised / Self-supervised',p:'l',
 s:'按"训练数据有没有答案、答案从哪来"划分的三种学习方式。',
 d:['监督学习：每条数据都带人工标注的答案，比如"这张图 → 猫"。效果好，但标注很贵。垃圾邮件识别、图像分类都属于这类。',
 '无监督学习：数据没有答案，让模型自己找结构，比如把一堆用户按行为自动分成几群（聚类）。常用于数据探索。',
 '自监督学习：答案就藏在数据自己里面。比如把一句话的下一个词遮住，让模型猜，原文就是答案。这样任何文本都能直接当训练数据，不需要人工标注。大语言模型的预训练就是自监督学习，所以才能用上几万亿 Token 的数据。',
 '另外还有强化学习：没有标准答案，只有"做得好给奖励"的信号，模型通过反复尝试学会怎么拿高分。RLHF 用的就是它。'],
 a:'监督学习像做带答案的练习册；无监督学习像给你一堆照片让你自己分类；自监督学习像做完形填空，原文就是答案；强化学习像训练小狗，做对了给零食。',
 t:['理解"自监督"就理解了大模型为什么能这么大：数据不再受人工标注的限制。'],
 r:['ml','pretrain','rlhf']},
split:{g:'base',n:'训练集 / 测试集',e:'Training set / Test set',p:'m',
 s:'把数据分成两份：一份用来学，一份藏起来专门考试。',
 d:['如果用同一批数据既训练又考试，模型可能只是把答案背下来了，分数很高但没有真学会。所以标准做法是把数据切开：训练集用来调整参数，测试集在训练中完全不碰，最后用来检验模型在"没见过的数据"上表现如何。',
 '通常还会再切出一份验证集，用来在训练过程中调整设置（比如学习率、训练多少轮），避免为了测试集分数去反复调参，导致测试集也被"间接背下来"。',
 '大模型时代有个类似的问题叫"数据污染"：如果某个公开的评测题库被混进了训练数据，模型在这个评测上的高分就不可信了。'],
 a:'老师出期末考题，不能直接用平时的练习题，否则只能测出谁背过答案，测不出谁真懂。',
 t:['你做 AI 应用的评测（Evals）时也是同样道理：调提示词时用一批题，最终验收用另一批没调过的题。'],
 r:['overfit','evals','loss']},
overfit:{g:'base',n:'过拟合 / 泛化',e:'Overfitting / Generalization',p:'m',
 s:'过拟合是"背答案"，泛化是"真学会"，机器学习的核心目标是泛化。',
 d:['过拟合：模型在训练数据上表现极好，换成新数据就很差。原因是它记住了训练数据里的偶然细节和噪声，而不是背后的普遍规律。',
 '欠拟合正好相反：模型太简单，连训练数据的规律都没学到。',
 '泛化：模型在没见过的数据上也能表现好。判断方法就是看测试集成绩。如果训练集成绩一直上升、测试集成绩却开始下降，就说明开始过拟合了。',
 '常见的应对方法：增加数据量、让模型更简单、提前停止训练、正则化（给太复杂的参数加惩罚）、随机丢弃部分神经元（Dropout）。大模型之所以泛化能力强，很大程度上是因为训练数据极其庞大和多样。'],
 a:'学生把练习册答案背得滚瓜烂熟，考试题目稍微换个说法就不会了，这就是过拟合。',
 t:['微调模型时要特别注意：用少量数据反复训练，很容易让模型过拟合到这批数据上，反而丢掉原来的通用能力。'],
 r:['split','loss','finetune']},
loss:{g:'base',n:'损失函数',e:'Loss Function',p:'l',
 s:'给模型的"错得有多离谱"打分的公式，训练的目标就是让这个分数越来越低。',
 d:['模型每做一次预测，损失函数就会把预测值和正确答案比较，算出一个数字。数字越大表示错得越多。',
 '不同任务用不同的损失函数。预测数值（比如房价）常用均方误差：预测值和真实值的差，平方后取平均。分类任务和大模型常用交叉熵：如果正确答案是"猫"，模型给"猫"的概率越低，损失越大。',
 '大模型预训练时的损失，就是"模型对真实的下一个词给出的概率有多低"。损失下降，意味着模型越来越擅长预测下一个词。'],
 a:'损失函数就像考试的扣分规则。梯度下降则是根据扣分情况，决定下次怎么改进。',
 t:['训练过程中看"损失曲线"是判断训练是否正常的第一手段：持续下降是好事，突然飙升往往说明出了问题。'],
 r:['gd','backprop','ml']},
neuron:{g:'base',n:'神经元',e:'Neuron',p:'m',
 s:'神经网络里最小的计算单元：输入乘以权重，加起来，再决定输出多少。',
 d:['一个人工神经元做的事情非常简单：接收几个输入数字，每个乘上一个权重（代表这个输入有多重要），全部加起来，再加一个偏置值，最后通过一个"激活函数"得到输出。',
 '激活函数的作用是引入"非线性"。如果没有它，不管堆多少层神经元，整体效果都等同于一个简单的线性公式，学不了复杂规律。常见的激活函数有 ReLU（负数变 0，正数原样输出）等。',
 '人工神经元是受生物神经元启发的，但只是很粗略的模仿。真实的大脑神经元要复杂得多，大模型也并不是在"模拟大脑"。'],
 a:'一个神经元像一个投票员：几条证据摆在面前，每条证据有不同的分量，加权合计后超过门槛就投"是"。',
 t:['权重就是神经元里的"旋钮"，模型的参数量基本就是所有神经元连接上的权重总数。'],
 r:['nn','param','gd']},
nn:{g:'base',n:'神经网络',e:'Neural Network',p:'h',
 s:'把大量神经元分层连接起来的结构，每根连线上的权重就是它学到的知识。',
 d:['神经网络通常分成三部分：输入层（接收原始数据，比如像素或词向量）、若干隐藏层（逐层加工信息）、输出层（给出结果，比如"猫 90%、狗 10%"）。',
 '信息从输入层一层层往后传，叫"前向传播"。每一层都在前一层的基础上提取更抽象的特征。以识图为例：前几层学会识别边缘和线条，中间层把它们组合成眼睛、耳朵，后面的层判断出"这是猫"。这种分工不是人设计的，而是训练中自己形成的。',
 '神经网络有很多种结构：处理图像的卷积神经网络（CNN）、早期处理序列的循环神经网络（RNN），以及现在统治语言领域的 Transformer。结构决定了神经元之间"怎么连"。'],
 a:'一个工厂流水线：每个车间（层）都对半成品做一点加工，原材料（像素）一路加工到最后变成成品（判断结果）。',
 t:['你不需要会手写神经网络也能做 AI 应用，但要知道：模型的所有"知识"都是这些权重数字，它们没法像数据库那样直接查询或修改某一条。'],
 r:['neuron','dl','transformer','backprop']},
dl:{g:'base',n:'深度学习',e:'Deep Learning',p:'m',
 s:'用层数很多的神经网络做机器学习，"深度"指的就是层数多。',
 d:['深度学习是机器学习的一个分支。神经网络的想法几十年前就有，但直到 2012 年前后才大爆发，主要是因为三件事凑齐了：互联网带来的海量数据、GPU 带来的巨大算力、以及训练深层网络的技术改进。',
 '2012 年，一个叫 AlexNet 的深度网络在图像识别比赛中大幅领先，被视为深度学习时代的开端。之后语音识别、机器翻译、围棋（AlphaGo）等领域接连被深度学习突破。',
 '深度学习最大的优势是能自动学习特征。以前做图像识别，要靠专家手工设计"什么样的像素组合算边缘"；深度学习直接从原始数据学，层数越多，能学到的特征越抽象、越复杂。'],
 a:'浅层网络像只能看懂简单笔画的人，深层网络能从笔画一路理解到字、词、句子的含义。',
 t:['今天的大语言模型都是深度学习模型，几十到上百层的 Transformer。'],
 r:['nn','transformer','scaling']},
gd:{g:'base',n:'梯度下降',e:'Gradient Descent',p:'m',
 s:'训练时调整权重的方法：沿着"让损失下降最快"的方向，一小步一小步地走。',
 d:['想象损失是一片山地，每个位置对应一组权重取值，海拔就是损失大小。训练的目标是找到最低的山谷。梯度就是当前位置的"坡度和方向"，梯度下降就是每次都朝下坡最陡的方向迈一步。',
 '每一步迈多大，由学习率决定。学习率太小，走得很慢；太大，会一步跨过谷底，在两边来回震荡甚至越走越高。实际训练中通常会让学习率先升后降。',
 '真实训练不会每次用全部数据算梯度（太慢），而是每次随机取一小批数据来算，叫随机梯度下降（SGD）。现在大模型最常用的是它的改进版 Adam / AdamW，会根据历史梯度自动调整每个参数的步长。'],
 a:'蒙着眼睛下山：看不到山谷在哪，只能用脚感受脚下哪边更低，就往哪边走一小步，一直重复。',
 t:['梯度下降找到的不一定是全局最低点，但对于大模型，实践证明找到的"足够低"的地方效果就已经很好。','"学习率"是微调模型时最常调的设置之一。'],
 r:['loss','backprop','param']},
backprop:{g:'base',n:'反向传播',e:'Backpropagation',p:'l',
 s:'计算"每个权重该往哪边调、调多少"的算法，是梯度下降的搭档。',
 d:['一个大模型有几十亿个权重。损失出来之后，我们需要知道每一个权重对这次错误负多少责任，才能决定怎么调整它。反向传播就是高效计算这个的方法。',
 '它的思路是从输出层开始，把误差一层层往回传：最后一层的权重对错误的贡献最直接，先算出来；再根据它推算前一层的贡献，依此类推。数学上用的是微积分里的链式法则。',
 '所以一次训练步骤是：前向传播（算出预测）→ 计算损失 → 反向传播（算出每个权重的梯度）→ 梯度下降（更新权重）。'],
 a:'一个项目出了问题，从最终结果开始往回追责：直接负责人担多少，他的上游又各担多少，一层层算到每个人头上。',
 t:['现在的框架（PyTorch 等）会自动完成反向传播，开发者几乎不用手写。'],
 r:['gd','loss','nn']},

// ───── 大模型结构
transformer:{g:'arch',n:'Transformer',e:'Transformer',p:'h',
 s:'2017 年提出的神经网络结构，核心是注意力机制，今天几乎所有大语言模型都基于它。',
 d:['Transformer 出自 Google 在 2017 年发表的论文《Attention Is All You Need》。它原本用于机器翻译，后来发现非常适合做大规模语言模型。GPT 的全称 Generative Pre-trained Transformer，最后那个 T 就是它。',
 '一个 Transformer 由很多个相同的"块"堆叠而成。每个块主要有两部分：注意力层（让每个词去看句子里的其他词，收集上下文信息）和前馈网络层（对每个词的信息做进一步加工，大量"知识"被认为存储在这里）。大模型会把这样的块堆几十到上百层。',
 '它取代之前的 RNN 主要有两个原因。第一，注意力让任意两个词都能直接关联，距离再远也不会遗忘。第二，它可以并行计算：RNN 必须一个词一个词按顺序处理，Transformer 可以同时处理整句，非常适合用大量 GPU 训练，模型因此能越做越大。',
 'GPT、Claude、Gemini、Grok、Llama、Qwen、DeepSeek 等主流大语言模型都属于 Transformer 家族，具体细节各有改良，比如有的使用混合专家结构（MoE）。'],
 a:'RNN 像一个人从头到尾逐字读书，读到后面容易忘了前面；Transformer 像把整本书摊开在桌上，每个词都能同时看到其他所有词。',
 t:['理解 Transformer 的计算量随上下文长度快速增长（标准注意力大约是长度的平方），就能理解为什么长上下文又贵又慢。'],
 r:['attention','token','embedding','moe','context']},
attention:{g:'arch',n:'注意力机制',e:'Attention / Self-Attention',p:'h',
 s:'让每个词根据上下文，决定该重点关注句子里的哪些其他词。',
 d:['在"小猫没有吃鱼，因为它不饿"这句话里，"它"指的是小猫还是鱼？人一看就知道。注意力机制让模型也能做到：处理"它"的时候，模型会给句子里每个词打一个"相关度"分数，"小猫"的分数最高，于是把小猫的信息大量融合进"它"的表示里。',
 '技术上，每个词会生成三个向量：Query（我在找什么）、Key（我能提供什么）、Value（我的实际内容）。用一个词的 Query 去和所有词的 Key 做匹配，得到注意力分数，再按分数把所有词的 Value 加权求和，就得到了这个词融合上下文后的新表示。',
 '模型通常有很多组注意力同时工作，叫"多头注意力"。不同的头会学会关注不同的关系：有的负责找代词指代，有的负责找主谓宾，有的负责找相邻的词。',
 '生成文本时还有一个限制：每个词只能看它前面的词，不能偷看后面的，这叫"因果注意力"，保证模型是在"预测"下一个词而不是"抄答案"。'],
 a:'开会时每个人发言前，会先扫一眼会场，判断谁说的话和自己最相关，重点参考那几个人的意见。',
 t:['"迷失在中间"现象和注意力有关：上下文很长时，注意力被分散，中间位置的信息容易被忽略。'],
 r:['transformer','embedding','lostmid']},
token:{g:'arch',n:'Token（词元）',e:'Token',p:'h',
 s:'模型读写文字的最小单位，文字会先被切成一个个 Token 再处理。',
 d:['神经网络只能处理数字，所以文字必须先被切成小块，每块对应一个编号。这些小块就是 Token。切法不是简单的按字或按词，而是按训练时统计出来的常见片段：常见词整个算一个 Token，罕见词被拆成几块。',
 '粗略估算：英文大约 1 个 Token 对应 0.75 个单词；中文大约 1 个汉字对应 1 到 2 个 Token，具体取决于模型的分词器。不同模型对同一段话切出的 Token 数可能不一样。',
 'Token 是大模型世界的通用计量单位：上下文窗口大小用 Token 计算，API 费用按 Token 收费，生成速度用"每秒多少 Token"衡量。',
 '模型一次只生成一个 Token。你看到回答一个字一个字地出现，就是因为它真的在逐个 Token 地生成。'],
 a:'Token 像乐高积木：常用的形状有现成的大块，奇怪的形状就用几个小块拼出来。',
 t:['估算成本和是否超出上下文限制时，要按 Token 算而不是按字数算。','模型对单个字母、数字的处理不太擅长（比如数单词里有几个 r），部分原因就是它看到的是 Token 而不是字母。'],
 r:['tokenizer','embedding','context','cost']},
tokenizer:{g:'arch',n:'分词器',e:'Tokenizer',p:'m',
 s:'负责把文字切成 Token、并给每个 Token 编号的程序。',
 d:['分词器在模型训练之前就要先准备好。常用的算法叫 BPE（字节对编码）：从单个字符开始，统计哪两个片段最常一起出现，就把它们合并成一个新 Token，反复合并直到词表达到设定大小（通常几万到十几万个 Token）。',
 '分词器决定了模型"看世界的方式"。如果训练数据里中文较少，中文就会被切得比较碎，同样的内容要用更多 Token，既占上下文又更贵。这也是不同模型处理中文效率不同的原因之一。',
 '分词器和模型是绑定的：模型只认识它自己分词器的编号，不能混用。'],
 a:'分词器像一本"切菜手册"，规定了每种食材切成什么形状，厨师（模型）只认识按这本手册切出来的东西。',
 t:['很多模型提供商有 Token 计数工具或接口，可以在发请求前算出确切 Token 数。'],
 r:['token','embedding']},
embedding:{g:'arch',n:'词向量 / 嵌入',e:'Embedding',p:'h',
 s:'把每个 Token 变成一串数字（向量），意思相近的词，数字也相近。',
 d:['Token 编号只是一个代号，"猫"是 1234、"狗"是 5678，看不出任何关系。所以模型的第一步，是把每个编号换成一串几百到几千维的数字，叫词向量。可以把它理解成这个词在一张"意义地图"上的坐标。',
 '这些坐标不是人设定的，而是训练中自动学出来的。训练完成后，意思相近的词会自然靠在一起："猫"和"狗"近，"猫"和"汽车"远。甚至方向也有含义：从"男人"到"女人"的方向，和从"国王"到"王后"的方向很相似。',
 '在 Transformer 里，词向量进入模型后会被注意力层一层层修改，融合上下文信息。所以同一个词"苹果"，在"吃苹果"和"苹果手机"里，经过几层之后的向量会变得不一样。',
 '在应用开发里，"Embedding"还特指用一个专门的嵌入模型，把一整段文字变成一个向量，用于语义搜索。RAG 检索就是靠这个。'],
 a:'给每个词在城市地图上分配一个住址：同类的词住在同一个街区，查找"跟它意思相近的词"就是找它的邻居。',
 t:['做 RAG 时，用来生成向量的嵌入模型和用来回答的大模型通常是两个不同的模型。','比较两个向量相似度常用"余弦相似度"。'],
 r:['token','rag','vectordb','attention']},
context:{g:'arch',n:'上下文窗口',e:'Context Window',p:'h',
 s:'模型一次最多能"看到"多少个 Token，是它唯一能读取的信息范围。',
 d:['模型本身没有记忆。每次你发消息，应用会把系统指令、对话历史、你的新问题、工具结果等全部打包，一次性送进模型。这个"包"的最大容量就是上下文窗口，单位是 Token，同时包括输入和模型的输出。',
 '超出窗口的内容，模型就完全看不到了。所以对话太长时，应用要么删掉最早的内容，要么把旧内容压缩成摘要。',
 '窗口大不等于用得好。研究发现，上下文很长时，模型对开头和结尾的信息利用得比较好，中间的容易被忽略。此外，上下文越长，计算越慢、费用越高。',
 '可以把模型的知识分成两种来源：权重里的（训练时学到的，量大但固定、可能过时）和上下文里的（当下放进来的，新鲜准确但容量有限）。RAG、Memory、压缩、Skill，本质上都是在管理上下文这块有限的空间。'],
 a:'上下文窗口像一张工作台：桌面只有这么大，放得下的资料才能用，放不下的只能收进柜子，需要时再拿出来。',
 t:['重要的指令放在开头（System Prompt）或最新的消息里，不要埋在长对话中间。','处理长文档时，把问题放在文档后面通常效果更好。'],
 r:['ctxeng','compact','lostmid','memory','rag']},
lostmid:{g:'arch',n:'迷失在中间',e:'Lost in the Middle',p:'m',
 s:'上下文很长时，模型容易忽略放在中间位置的信息。',
 d:['2023 年有研究把一条关键信息放在长文档的不同位置，测试模型能否找到它。结果画出来是一条 U 形曲线：信息在开头或结尾时准确率高，在中间时明显下降。',
 '可能的原因包括：注意力需要在越来越多的 Token 之间分配，信息被稀释；训练数据里重要内容常出现在开头和结尾，模型学到了这种位置偏好；模型训练时见过的超长文本相对较少。',
 '较新的模型在这方面有很大改善，但上下文越长、信息越分散，问题依然越明显。'],
 a:'听一场三小时的讲座，你通常记得开场和结尾讲了什么，中间那一段最容易走神。',
 t:['和任务最相关的资料放在靠近问题的位置。','RAG 时不要一次塞太多检索结果，精选几段比塞几十段效果更好。'],
 r:['context','attention','rerank']},
temperature:{g:'arch',n:'温度 / 采样',e:'Temperature / Sampling',p:'m',
 s:'模型算出每个候选词的概率后，用来控制"怎么从中挑一个"的随机程度。',
 d:['模型每一步的输出其实不是一个词，而是词表里所有 Token 的概率分布，比如"吃饭 45%、健身 20%、逛街 15%……"。接下来要从中选一个，这一步叫采样。',
 '温度控制分布的"尖锐程度"。温度低（接近 0）时，高概率的词被进一步放大，几乎每次都选最可能的那个，输出稳定、保守。温度高时，分布变平，低概率的词也有机会被选中，输出更有变化，但也更容易离谱。',
 '还有其他采样参数：Top-k（只从概率最高的 k 个里选）、Top-p（只从累计概率达到 p 的那些词里选）。',
 '这也解释了为什么同一个问题问两次，回答会不一样。'],
 a:'温度像点菜时的冒险程度：低温度永远点招牌菜，高温度偶尔会点一道从没吃过的怪菜。',
 t:['写代码、提取信息、回答事实问题：用低温度。写创意文案、头脑风暴：可以调高。','部分推理模型或 API 对温度有固定要求，以官方文档为准。'],
 r:['token','hallucination']},
hallucination:{g:'arch',n:'幻觉',e:'Hallucination',p:'h',
 s:'模型自信地编造出不存在或不正确的信息。',
 d:['幻觉的根源在于模型的工作方式：它在预测"最像样的下一个词"，而不是在查找事实。当它不知道答案时，写出一个"听起来很像正确答案"的句子，往往比说"我不知道"更符合它学到的语言规律。',
 '典型表现：编造不存在的论文、书籍、网址、API 函数名；把两个人的事迹张冠李戴；具体数字、日期出错；对很新或很冷门的话题给出看似合理的错误答案。',
 '减轻幻觉的方法：用 RAG 或搜索给模型提供真实资料；在提示词里明确允许它说"不知道"；要求它给出处并核对；用更强的模型；通过训练（RLHF 等）让模型更诚实。这些方法能大幅减少幻觉，但目前还无法完全消除。'],
 a:'一个口才很好的人被问到不懂的问题，为了不冷场，凭印象说了一个听起来很像那么回事的答案。',
 t:['在产品里，涉及事实、数字、引用的地方，尽量让模型基于你提供的资料回答，并设计核对机制。','让模型输出结构化数据时，校验字段是否合法，不要假设它一定对。'],
 r:['rag','temperature','cutoff','evals']},
param:{g:'arch',n:'参数量（7B、70B）',e:'Parameters',p:'h',
 s:'模型里权重的总数，B 是 Billion（十亿），70B 就是 700 亿个参数。',
 d:['参数就是神经网络里所有可调节的权重。参数越多，模型能存储的知识和能表达的规律越复杂，通常也越聪明。',
 '参数量直接决定运行成本：每个参数要占内存。以常见的 16 位精度为例，每个参数 2 字节，一个 70B 模型光权重就需要约 140GB 显存，普通电脑根本跑不动。量化可以把这个数字大幅压缩。',
 '参数多不等于一定更强。训练数据的质量和数量、训练方法、模型结构都很重要。一个训练得好的小模型，可能比训练得差的大模型更好用。闭源模型（Claude、GPT 等）通常不公布参数量。',
 '对 MoE 模型，要区分"总参数"和"激活参数"：总参数很大，但每次计算只用到其中一小部分。'],
 a:'参数量像图书馆的藏书容量：容量越大能放的书越多，但书本身选得好不好（数据质量）同样关键。',
 t:['选开源模型时，先看你的硬件能跑多大的模型，再看效果。','同一家的模型系列通常分大中小几档：大的聪明但贵慢，小的便宜快速，按任务选择。'],
 r:['neuron','quant','moe','scaling','cost']},
moe:{g:'arch',n:'MoE 混合专家',e:'Mixture of Experts',p:'l',
 s:'模型内部分成很多"专家"子网络，每个 Token 只激活其中少数几个。',
 d:['普通模型处理每个 Token 时，所有参数都要参与计算。MoE 模型把前馈网络层拆成很多个"专家"，再加一个"路由器"，负责判断当前 Token 该交给哪几个专家处理。',
 '好处是：总参数可以做得非常大（知识容量大），但每个 Token 只用到一小部分参数（计算量小、速度快）。比如一个模型总共有几千亿参数，但每次只激活其中几百亿。',
 '代价是：所有专家的参数仍然要全部装进内存，对硬件要求依然很高；训练也更复杂，要防止路由器总是只用某几个专家。',
 '多个知名开源模型（例如 Mixtral、DeepSeek 的部分版本）都公开采用了 MoE 结构。'],
 a:'一家大医院有很多科室专家，分诊台（路由器）根据病情只把你送到相关的两三个科室，不需要所有医生都来看你。',
 t:['看到模型标注类似"总参数 / 激活参数"两个数字时，通常就是 MoE 模型。'],
 r:['param','transformer']},
scaling:{g:'arch',n:'Scaling Law 规模定律',e:'Scaling Laws',p:'l',
 s:'研究发现：模型越大、数据越多、算力越多，效果会按可预测的规律提升。',
 d:['2020 年前后，研究者发现语言模型的损失与参数量、数据量、计算量之间存在比较稳定的幂律关系：把这三者按比例增加，模型效果就会按可预测的曲线变好。',
 '这个发现让"把模型做大"变成了一项可规划的工程，而不是赌博。它是这几年各家公司投入巨额算力、模型规模快速增长的主要理论依据之一。',
 '后来的研究（如 DeepMind 的 Chinchilla 论文）补充说，参数量和数据量要平衡增长，很多早期模型其实"数据不够、参数偏多"。',
 '近两年又出现了"推理时扩展"的思路：不只在训练时投入更多计算，也在回答时让模型花更多计算去思考，同样能提升效果。推理模型就是这个方向的代表。'],
 a:'像修路：投入的人力、材料、时间按比例增加，修出的路长度可以提前估算出来。',
 t:['规模定律描述的是趋势，不保证无限有效，业界一直在讨论它会不会以及何时放缓。'],
 r:['param','pretrain','reasoning']},
multimodal:{g:'arch',n:'多模态',e:'Multimodal',p:'m',
 s:'模型不只处理文字，还能理解图片、音频、视频，甚至生成它们。',
 d:['早期的大语言模型只能处理文字。多模态模型可以接收多种类型的输入，比如看一张截图、读一份 PDF 里的图表、听一段语音。',
 '常见做法是：用专门的编码器把图片切成小块，变成和文字 Token 类似的向量序列，再和文字一起送进 Transformer。这样模型就能在同一个上下文里同时"看图"和"读字"。',
 '输出端也可以是多模态的：生成图片、语音或视频。不同的模型支持的输入输出类型差别很大。'],
 a:'从"只能读信"的人，变成"能看照片、听录音、还能画图"的人。',
 t:['给模型发截图让它找 UI 问题、读设计稿、解析表格图片，对前端开发很实用。','图片也会消耗 Token，大图通常更贵。'],
 r:['token','embedding','transformer']},

// ───── 训练与对齐
pretrain:{g:'train',n:'预训练',e:'Pre-training',p:'h',
 s:'在海量文本上让模型反复"猜下一个词"，学会语言和世界知识。',
 d:['预训练是造大模型的第一步，也是最花钱的一步。训练数据来自网页、书籍、论文、代码等，规模可达几万亿 Token。训练任务只有一个：给定前面的文字，预测下一个 Token。',
 '这个看似简单的任务，要做到极好，模型就不得不学会很多东西：语法、事实知识、常识推理、代码逻辑、不同文体的写法。可以说，知识是"预测下一个词"的副产品。',
 '预训练需要成千上万张 GPU 连续运行数周到数月，成本极高，所以只有少数机构能从头训练前沿大模型。训练完成后得到的模型叫基座模型。',
 '训练数据有截止时间，之后的事情模型不知道，这就是知识截止日期的来源。数据里的偏见和错误，也会被模型一并学进去。'],
 a:'让一个人把图书馆里所有的书读一遍，他会变得博学，但还不知道怎么当一个好助手。',
 t:['应用开发者几乎不会做预训练，但要知道模型的知识边界由预训练数据决定。'],
 r:['base','supervised','cutoff','sft','scaling']},
base:{g:'train',n:'基座模型',e:'Base Model',p:'m',
 s:'只经过预训练的模型，知识丰富，但只会续写，还不会当助手。',
 d:['基座模型的行为就是"续写最可能出现的文字"。你问它"法国的首都是哪里？"，它可能不回答，而是接着写"德国的首都是哪里？意大利的首都是哪里？"，因为在网上，这种问句后面经常跟着更多问题（比如一份试卷）。',
 '基座模型是后续所有微调的起点。很多开源模型会同时发布两个版本：Base 版（基座）和 Instruct / Chat 版（经过指令微调的助手版）。',
 '基座模型对研究者和需要深度定制的团队有价值，普通应用开发直接用 Instruct / Chat 版即可。'],
 a:'一个读完所有书但从没和人聊过天的学者，你说一句话，他只会顺着往下"背书"。',
 t:['下载开源模型时，注意区分 base 和 instruct 版本，做对话应用要用 instruct 版。'],
 r:['pretrain','sft']},
finetune:{g:'train',n:'微调',e:'Fine-tuning',p:'m',
 s:'在训练好的模型基础上，用少量特定数据再训练一下，改变它的行为。',
 d:['微调的计算量远小于预训练，用的数据可能只有几千到几十万条。它主要用来改变模型的"行为方式"，比如回答格式、语气风格、擅长某类专门任务。',
 '常见的微调方式：全参数微调（调整所有权重，效果好但贵）和参数高效微调，比如 LoRA（冻结原模型，只训练一小组额外的参数，便宜很多，是目前最流行的方式）。',
 '微调有几个常见误区。第一，微调不擅长"灌输新知识"：想让模型知道你公司的文档，RAG 通常比微调效果好、成本低、更新也方便。第二，数据少且反复训练容易过拟合，甚至让模型丢掉原有能力（灾难性遗忘）。',
 '前面说的 SFT 和 RLHF 都属于广义的微调。'],
 a:'一个已经大学毕业的人，参加三个月的岗前专项培训。',
 t:['想定制模型时，先试提示词，再试 RAG，最后才考虑微调。','部分模型提供商的 API 支持在线微调，开源模型可以用 LoRA 自己微调。'],
 r:['sft','rlhf','choose','overfit']},
sft:{g:'train',n:'监督微调 SFT',e:'Supervised Fine-Tuning',p:'m',
 s:'用人写好的"问题 + 优质回答"示范来训练，让基座模型学会当助手。',
 d:['SFT 是把基座模型变成助手的第一步。标注人员会写大量示范对话：用户提一个问题，助手给出一个高质量回答。模型在这些数据上继续训练，学会"看到问题就该回答"，以及回答应该是什么样子。',
 '数据量通常是几万到几十万条，远小于预训练，但质量要求很高。示范数据覆盖的场景越全面（写作、编程、问答、多轮对话、拒绝有害请求），模型学到的助手行为越完整。',
 'SFT 的局限是：模型只是在模仿示范，示范里没覆盖到的情况它不一定处理得好；而且写出完美的示范回答很费人力。所以后面通常还要接一步 RLHF。'],
 a:'新员工上岗培训：师傅先示范几百个标准接待流程，新人照着学。',
 t:['你自己做微调时，用的也基本是 SFT：准备"输入 → 期望输出"的数据对。'],
 r:['base','rlhf','finetune']},
rlhf:{g:'train',n:'RLHF 人类反馈强化学习',e:'Reinforcement Learning from Human Feedback',p:'m',
 s:'让人比较回答的好坏，训练出一个"自动评委"，再用它引导模型往人类偏好的方向调整。',
 d:['RLHF 分两步。第一步，训练奖励模型：让模型对同一个问题生成多个回答，由人来比较"A 和 B 哪个更好"，收集大量这样的比较数据，训练出一个能给回答打分的奖励模型。',
 '第二步，强化学习：让模型大量生成回答，奖励模型给每个回答打分，模型根据分数调整权重，越来越倾向于写出高分回答。这一步常用的算法叫 PPO，后来也出现了 DPO 等更简单的方法，可以直接从偏好数据学习，不必单独训练奖励模型。',
 '为什么不直接让人打分？因为强化学习需要几十万甚至上百万次评分，人工来不及。所以先用少量人类判断训练出评委，再让评委大规模打分。',
 'RLHF 让模型变得更有帮助、更诚实、更会拒绝有害请求。它的一个已知副作用是：模型可能学会讨好评委，比如过度迎合用户、回答写得很长显得更认真。'],
 a:'训练小狗：做对了给零食，做错了不给。重复多次后，它就学会了你想要的行为。',
 t:['理解 RLHF 能帮你理解模型为什么有时过于客气、啰嗦或谨慎，这些往往是训练偏好留下的痕迹。'],
 r:['reward','sft','cai','alignment','reasoning']},
reward:{g:'train',n:'奖励模型',e:'Reward Model',p:'l',
 s:'学会了人类偏好、能给模型回答自动打分的模型。',
 d:['奖励模型本身也是一个神经网络，通常由语言模型改造而来。它的输入是"问题 + 回答"，输出是一个分数，表示人类大概会多喜欢这个回答。',
 '它是从人类的比较数据中学出来的：人说"A 比 B 好"，奖励模型就学着给 A 打更高的分。学好之后，它就能代替人类在强化学习阶段大规模打分。',
 '奖励模型不完美，模型可能找到它的漏洞，用一些"投机取巧"的方式拿高分但实际回答并不好，这叫"奖励黑客"（Reward Hacking），是对齐研究的重点问题之一。'],
 a:'学会了老板口味的助理，能先帮老板筛一遍方案，给每份打个预估分。',
 t:['同样的思路也被用在应用开发里：用一个模型给另一个模型的输出打分，叫"LLM 当评委"（LLM-as-a-Judge），常用于评测。'],
 r:['rlhf','evals','alignment']},
cai:{g:'train',n:'宪法 AI',e:'Constitutional AI / RLAIF',p:'l',
 s:'Anthropic 提出的方法：写下明确的原则，让 AI 依据原则去评判和改进回答。',
 d:['传统 RLHF 高度依赖人工标注，成本高，而且标注员的判断不一定一致。宪法 AI 的思路是：先写一份明确的原则清单（"宪法"），比如"选择更诚实、更无害的回答"，然后让模型自己根据这些原则批评和修改回答，或者比较两个回答哪个更符合原则。',
 '这些由 AI 生成的偏好数据再用于训练，所以这类方法也叫 RLAIF（基于 AI 反馈的强化学习）。',
 '它的好处是：原则写在纸面上，行为依据更透明；减少了对大量人工标注的依赖；也减少了人类标注员接触有害内容的需要。Anthropic 用这类方法训练 Claude，其他机构也有类似的做法。'],
 a:'不再靠领导一份份审批，而是写一本公司章程，让员工对照章程自查自改。',
 t:['写 System Prompt 时，给出清晰的原则和理由，往往比堆一长串禁止事项效果更好，思路相通。'],
 r:['rlhf','alignment','sysprompt']},
reasoning:{g:'train',n:'推理模型',e:'Reasoning Models',p:'m',
 s:'在回答前先进行一段较长的"思考"，一步步推导，再给出答案的模型。',
 d:['普通模型拿到问题后直接开始写答案。推理模型会先生成一段思考过程：拆解问题、尝试不同思路、检查中间结果、发现错误再修正，最后才输出答案。',
 '这种能力主要靠强化学习训练出来：给模型大量有明确对错的题目（数学、编程、逻辑题），模型自己摸索解法，做对了给奖励。在这个过程中，模型逐渐学会了更长、更有效的思考方式。',
 '推理模型在数学、编程、复杂分析上通常明显更强，代价是回答更慢、消耗更多 Token。简单问题用推理模型往往是浪费。',
 '许多产品里会显示"正在思考"，或者提供一个"扩展思考"开关，就是在使用这种能力。'],
 a:'普通模型像抢答，听完题马上开口；推理模型像考试时先在草稿纸上算一遍，再把答案写到卷面上。',
 t:['复杂任务开启思考，简单任务关闭，以平衡效果和成本。','即使不用推理模型，在提示词里要求"先分步分析再给结论"也能提升效果，这叫思维链（CoT）。'],
 r:['prompt','scaling','rlhf','cost']},
distill:{g:'train',n:'蒸馏',e:'Knowledge Distillation',p:'l',
 s:'用大模型（老师）的输出去训练小模型（学生），让小模型学到大模型的部分能力。',
 d:['大模型能力强，但运行昂贵。蒸馏的做法是：让大模型对大量问题给出回答（甚至给出每个词的完整概率分布），再用这些数据训练一个小得多的模型。',
 '学生模型学的不只是"正确答案是什么"，还有老师的"思考倾向"，所以往往比用同样数据从头训练效果更好。很多"小而强"的模型就是这样来的。',
 '需要注意：很多商业模型的使用条款禁止用其输出去训练竞争模型，做蒸馏前要看清楚许可。'],
 a:'名师把多年经验浓缩成一套讲义教给学生，学生不用走完老师的全部路，也能掌握大部分本领。',
 t:['如果一个小模型在特定任务上就够用，它能大幅降低成本和延迟。'],

alignment:{g:'train',n:'对齐',e:'Alignment',p:'m',
 s:'让 AI 的行为符合人类的意图和价值观：有帮助、诚实、不造成伤害。',
 d:['一个只会预测下一个词的模型，并不天然知道人类想要什么。它可能照着用户字面意思做了事，却不是用户真正想要的；也可能把网上学到的有害内容输出出来。对齐就是解决"模型能力"和"人类意图"之间差距的研究领域。',
 '前面讲的 SFT、RLHF、宪法 AI，都是目前常用的对齐手段。',
 '对齐也关注更长远的问题：随着 AI 越来越强，怎样确保它的目标和人类一致、行为可预测、出了问题能被发现和纠正。可解释性研究（理解模型内部到底在计算什么）就是其中一个重要方向。'],
 a:'招来一个非常能干的员工，对齐就是确保他的能干用在公司真正想要的方向上。',
 t:['你在 System Prompt 里定义产品的规则和边界，可以看作应用层面的"对齐"。'],

// ───── 使用模型
infer:{g:'deploy',n:'训练 vs 推理',e:'Training vs Inference',p:'h',
 s:'训练是调权重造模型（极贵、只做一次）；推理是用造好的模型回答问题（每次调用都发生）。',
 d:['训练阶段：反复前向传播、计算损失、反向传播、更新权重。需要海量数据和巨大算力，产物是一份固定的权重文件。',
 '推理阶段：权重已经固定不变，模型只做前向传播：读入上下文，一个 Token 一个 Token 地生成输出。你每次调用 API、每次在聊天界面提问，都是一次推理。',
 '注意"推理"这个中文词有两种意思：一是这里说的 Inference（模型运行），二是 Reasoning（逻辑推理，比如推理模型）。读文章时要根据上下文区分。',
 '应用开发者几乎只和推理打交道。和你聊天时，模型并不会因为这次对话而学习或改变权重。'],
 a:'训练是写一本书，推理是读者每次翻开这本书查内容。书写好之后，翻阅多少次都不会改变书的内容。',
 t:['API 费用就是推理费用，按输入和输出的 Token 计费。','"和 AI 多聊几次它就记住了"是误解，跨对话的"记忆"靠的是 Memory 这类外部机制。'],
 r:['pretrain','cost','memory','reasoning']},
cutoff:{g:'deploy',n:'知识截止日期',e:'Knowledge Cutoff',p:'h',
 s:'模型训练数据的截止时间，之后发生的事情它不知道。',
 d:['预训练数据收集到某个时间点就停止了，之后还有几个月的训练和测试才会发布。所以模型发布时，它的知识通常已经落后一段时间，而且这个差距会随着使用时间越来越大。',
 '对于截止日期之后的事情，模型可能直接说不知道，也可能用旧知识给出过时的答案，甚至编造。比如问某个职位现在是谁担任，它可能给出截止日期时的人选。',
 '解决办法是让模型使用搜索工具，或者通过 RAG 提供最新资料。'],
 a:'一个在山里闭关了一年的人，他的知识停在进山那天，出山后需要看看新闻才能跟上。',
 t:['用模型写代码时，它可能推荐已经过时的库版本或 API 写法，要以官方文档为准。','涉及"最新""现在"的问题，给模型接上搜索。'],
 r:['pretrain','rag','hallucination']},
opensource:{g:'deploy',n:'开源权重 vs 闭源',e:'Open-weight vs Closed',p:'m',
 s:'闭源模型只能通过 API 使用；开源权重模型可以下载下来自己运行。',
 d:['闭源模型（如 Claude、GPT、Gemini）的权重不公开，只能通过官方 API 或产品使用。优点是通常能力最强、不用管服务器；缺点是数据要发给服务商、依赖对方的价格和政策。',
 '开源权重模型（如 Llama、Qwen、DeepSeek、Mistral 的部分模型）公开了权重文件，你可以下载到自己的服务器或电脑上运行、微调。优点是可控、数据不出本地、长期成本可能更低；缺点是需要硬件和运维能力，能力通常略逊于最前沿的闭源模型。',
 '严格来说，很多模型只是"开放权重"，并没有公开训练数据和完整训练代码，许可协议也各有限制（比如商用条件），所以"开源"这个说法有争议。'],
 a:'闭源像去餐厅吃饭，方便但只能点菜单上的；开源权重像拿到了菜谱和食材，可以自己在家做、随意改，但得自己下厨。',
 t:['公司有严格数据合规要求时，开源权重 + 本地部署是常见选择。','用开源模型前一定要看许可协议。'],
 r:['quant','privacy','param']},
quant:{g:'deploy',n:'量化 / 本地部署',e:'Quantization / Local Deployment',p:'l',
 s:'把权重从高精度压缩成低精度，让大模型能在普通电脑上运行。',
 d:['模型权重默认通常是 16 位浮点数。量化就是把它们压缩成 8 位、4 位甚至更低。4 位量化后，模型体积大约只剩原来的四分之一，一个原本需要 140GB 的 70B 模型，可以压到 40GB 左右。',
 '代价是精度损失，模型会变笨一点。一般 8 位几乎看不出差别，4 位在多数任务上仍然可用，再低就明显下降了。',
 '常用的本地运行工具有 Ollama、llama.cpp、LM Studio 等，常见的量化文件格式有 GGUF。服务器端的高性能推理框架有 vLLM 等。'],
 a:'把高清照片压缩成较小的 JPG：文件小了很多，肉眼看差别不大，但放大细看能发现损失。',
 t:['想在自己电脑上体验，可以先装 Ollama 跑一个几 B 参数的小模型。','苹果芯片的统一内存对本地跑模型比较友好。'],
 r:['param','opensource','cost']},
cost:{g:'deploy',n:'Token 成本与延迟',e:'Cost & Latency',p:'h',
 s:'API 按 Token 收费，输出比输入贵；上下文越长、模型越大，就越贵越慢。',
 d:['API 价格通常按"每百万 Token"计算，输入和输出分开定价，输出一般比输入贵好几倍，因为输出要一个个 Token 生成。',
 '延迟分两部分：首个 Token 的等待时间（模型读完全部输入的时间，上下文越长越久），以及之后每秒生成多少 Token。',
 '降低成本的常用手段：选够用的最小模型；精简上下文，别把无关内容塞进去；使用提示缓存（Prompt Caching），重复的前缀（如长 System Prompt、固定文档）只需第一次全价处理，后续调用便宜很多、也更快；非实时任务用批处理接口，通常有折扣。',
 '一个真实产品里，多轮对话、Agent 循环、RAG 检索结果都会让 Token 数快速膨胀，上线前一定要估算。'],
 a:'打出租车：按里程（Token）计价，豪华车（大模型）每公里更贵，绕远路（冗长上下文）多花钱又多花时间。',
 t:['记录每次调用的输入输出 Token 数，是做成本优化的第一步。','Agent 每循环一次都会重新发送整个上下文，成本随步骤数快速增长。'],
 r:['token','context','stream','param']},
stream:{g:'deploy',n:'流式输出',e:'Streaming',p:'m',
 s:'模型一边生成一边把内容推送给前端，而不是等全部写完再返回。',
 d:['因为模型是逐个 Token 生成的，一个长回答可能要十几秒甚至更久。如果等全部生成完再显示，用户会盯着空白页面等很久。流式输出让第一个字在一两秒内就出现，体验好得多。',
 '技术上，大多数 LLM API 使用 SSE（Server-Sent Events）协议：一个 HTTP 请求保持连接，服务器持续推送小块数据，每块包含新生成的几个 Token，最后发送结束标志。',
 '前端处理时要注意：逐块拼接文本、处理 Markdown 渲染（未闭合的代码块等）、支持中途取消、处理网络中断。工具调用、结构化输出在流式模式下也会分块到达，需要拼接完整后再解析。'],
 a:'看直播而不是等录像：内容一边产生一边播放，不用等整场结束。',
 t:['前端实现可以用 fetch + ReadableStream 读取 SSE 流，或者直接用官方 SDK 提供的流式接口。','后端做代理转发时，注意关闭缓冲，否则流式效果会失效。'],
 r:['token','cost','structured']},

prompt:{g:'app',n:'提示词工程',e:'Prompt Engineering',p:'h',
 s:'通过设计输入内容，让模型输出更准确、更符合需求的结果。',
 d:['模型的输出高度依赖输入。同样的模型，提示词写得好坏，效果可能天差地别。提示词工程是做 AI 应用时投入最小、回报最大的技能。',
 '最重要的原则是"像给一位聪明但不了解情况的新同事交代任务"：说清楚背景（这是什么项目、给谁用）、目标（要达成什么）、约束（字数、格式、语气、不要做什么）以及判断标准（什么样算好）。',
 '常用技巧：给示例（Few-shot，展示一两个输入输出的样例）；要求先分步分析再下结论（思维链，Chain of Thought）；用 XML 标签或分隔符把指令、资料、问题分开；指定输出格式；给模型一个"不知道就说不知道"的出口；复杂任务拆成多步，每步一次调用（提示链）。',
 '提示词需要迭代：写一版 → 用一批测试问题跑 → 看哪里不好 → 修改。这就要用到评测。'],
 a:'给装修师傅交代需求：只说"装好看点"，结果全凭运气；说清楚风格、预算、哪面墙要放书架，结果才可控。',
 t:['提示词也是代码，建议放进版本控制，每次修改都跑一遍评测。','解释"为什么"比只下命令更有效，模型能据此推断边界情况。'],
 r:['sysprompt','structured','evals','reasoning','ctxeng']},
sysprompt:{g:'app',n:'System Prompt 系统提示词',e:'System Prompt',p:'h',
 s:'开发者在对话最前面设定的指令，定义 AI 的身份、规则、风格和边界。',
 d:['调用 API 时，消息分为几种角色：system（系统指令）、user（用户）、assistant（模型回答）。System Prompt 放在最前面，通常用户看不到，用来设定整个对话的基调。',
 '典型内容包括：角色和任务（"你是某某公司的客服助手"）、背景知识（产品信息、用户信息）、行为规则（能做什么、不能做什么、遇到某类问题怎么处理）、输出风格（语气、长度、格式）、工具使用说明。',
 '模型会比较认真地遵守 System Prompt，但它不是绝对的安全边界：用户可能通过越狱或提示注入试图绕过。关键的权限控制不能只靠提示词，要在代码层面实现。'],
 a:'System Prompt 像员工入职时拿到的岗位说明书：你是谁、负责什么、有哪些规矩。',
 t:['你做的 AI 产品"性格"如何，主要靠 System Prompt 决定。','长而固定的 System Prompt 适合配合提示缓存，降低成本。','不要在 System Prompt 里放密钥等敏感信息，它有可能被套出来。'],
 r:['prompt','compact','safety_inject','cost']},
structured:{g:'app',n:'结构化输出',e:'Structured Output',p:'h',
 s:'让模型按照固定格式（通常是 JSON）输出，方便程序直接解析使用。',
 d:['模型默认输出自由文本，程序很难可靠地从中提取信息。结构化输出让模型按照你定义的结构返回数据，比如 {"sentiment":"positive","score":0.9}。',
 '实现方式有几种可靠程度：在提示词里要求输出 JSON（最简单，但偶尔格式出错）；利用工具调用，把想要的结构定义成工具参数（模型会按参数结构填写）；使用 API 提供的结构化输出功能，按 JSON Schema 强制约束生成，可靠性最高。',
 '即使格式正确，内容仍可能有误（比如分类判断错误），所以程序拿到数据后仍应做校验，例如 Python 里用 Pydantic 校验字段类型和取值范围。'],
 a:'让人填一张表格，而不是写一篇作文：每一栏要填什么都规定好了，收回来直接录入系统。',
 t:['前后端对接 AI 时几乎必用。','Python 里可以用 Pydantic 定义模型类，再转换成 JSON Schema 交给 API。','字段名和描述写清楚，模型会参考描述来填写。'],
 c:`from pydantic import BaseModel

class Review(BaseModel):
    sentiment: str   # positive / negative / neutral
    score: float     # 0 到 1
    keywords: list[str]

# 把 Review 的 JSON Schema 交给 API 的结构化输出 / 工具参数，
# 拿到结果后再校验一次：
data = Review.model_validate_json(model_output)`,
 r:['tool','prompt','hallucination']},
rag:{g:'app',n:'RAG 检索增强生成',e:'Retrieval-Augmented Generation',p:'h',
 s:'先从资料库里检索相关内容，再把它和问题一起交给模型回答，相当于"开卷考试"。',
 d:['模型的知识固定在权重里，不知道你的私有文档，也不知道最新信息。RAG 的思路是：用户提问时，先去资料库搜出最相关的几段内容，拼进提示词，让模型"根据以下资料回答"。',
 '完整流程分两个阶段。准备阶段（离线）：把文档切成小段（切块）→ 用嵌入模型把每段变成向量 → 存进向量数据库。查询阶段（在线）：把用户问题也变成向量 → 在向量库里找最相似的几段 → （可选）重排序 → 拼进提示词 → 模型生成回答，最好附上引用来源。',
 '为什么用向量检索而不是关键词搜索？因为向量比较的是"意思"：用户问"能休几天假"，也能找到写着"年假 10 天"的段落，即使字面上没有重合的词。实践中常把关键词检索（BM25）和向量检索结合使用，叫混合检索。',
 'RAG 的优点：减少幻觉、知识可以随时更新（改文档就行，不用重新训练）、可以给出处、可以按用户权限控制能检索的资料。它的效果上限主要取决于检索质量：检索不到正确的段落，模型再强也答不对。'],
 a:'开卷考试：先翻书找到相关的那几页，再照着书写答案，而不是全凭记忆。',
 t:['入门可以用 PostgreSQL + pgvector 扩展，不用额外部署新的数据库。','RAG 出问题时，先检查检索到的段落对不对，大多数问题出在检索而不是生成。','Agent 时代也常让模型自己决定何时调用"搜索资料"工具，叫 Agentic RAG。'],
 c:`# 最小 RAG 流程（伪代码）
chunks = split(documents, size=500)              # 1. 切块
vectors = embed(chunks)                          # 2. 向量化
db.insert(chunks, vectors)                       # 3. 存入向量库

q_vec = embed(question)                          # 4. 问题向量化
top = db.search(q_vec, k=4)                      # 5. 相似度检索
prompt = f"根据以下资料回答，资料中没有就说不知道：\\n{top}\\n\\n问题：{question}"
answer = llm(prompt)                             # 6. 生成回答`,
 r:['chunk','embedding','vectordb','rerank','hallucination','choose']},
chunk:{g:'app',n:'切块',e:'Chunking',p:'m',
 s:'RAG 准备阶段把长文档切成小段，每段单独向量化和检索。',
 d:['为什么要切？一是嵌入模型和上下文都有长度限制；二是一整篇文档变成一个向量后，具体细节会被"平均掉"，检索不准；三是只把相关的几段放进上下文，比放整篇更省 Token、效果也更好。',
 '切得太大，一段里混了多个主题，检索不精确；切得太小，一段话失去上下文，比如"它的价格是 99 元"，单看这一段不知道"它"是什么。常见做法是每段几百个 Token，相邻段之间保留一定重叠。',
 '更好的做法是按文档结构切：按标题、段落、Markdown 章节、代码函数来切，而不是机械地按字数切。还可以给每段加上所属文档标题、章节名等元数据，提升检索和理解效果。'],
 a:'把一本书做成卡片：每张卡片讲一个知识点，太大的卡片查找不方便，太小的卡片看不懂在说什么。',
 t:['切块策略对 RAG 效果影响很大，值得针对你的文档类型多试几种。'],
 r:['rag','embedding','vectordb']},
vectordb:{g:'app',n:'向量数据库',e:'Vector Database',p:'m',
 s:'专门存储向量、并能按相似度快速查找"最接近的向量"的数据库。',
 d:['普通数据库擅长精确查询（WHERE id = 5）。向量数据库擅长的是近似查询："找出和这个向量最相似的 10 个"。当数据量达到百万级时，逐个比较太慢，向量数据库会使用专门的索引算法（如 HNSW）实现快速的近似搜索。',
 '选择大致有三类：专用向量数据库（Milvus、Qdrant、Weaviate、Pinecone 等）；轻量嵌入式方案（Chroma、FAISS，适合原型和本地实验）；传统数据库加向量扩展（PostgreSQL 的 pgvector、以及 Elasticsearch、Redis 等产品的向量功能）。',
 '向量通常和原文、元数据（来源、日期、权限）一起存储，这样检索时可以加过滤条件，比如"只搜这个用户有权限看的文档"。'],
 a:'一个按"意思"排列的图书馆，你拿着一个问题进去，管理员直接把意思最接近的几本书递给你。',
 t:['你在学 PostgreSQL，pgvector 是最顺手的入门方式：建一个 vector 类型的列，用 <=> 运算符按余弦距离排序即可。'],
 c:`-- PostgreSQL + pgvector 示意
CREATE EXTENSION IF NOT EXISTS vector;
CREATE TABLE chunks (
  id bigserial PRIMARY KEY,
  content text,
  embedding vector(1024)   -- 维度取决于你用的嵌入模型
);
-- 查询最相似的 4 段（<=> 为余弦距离）
SELECT content FROM chunks
ORDER BY embedding <=> $1
LIMIT 4;`,
 r:['rag','embedding','chunk']},
rerank:{g:'app',n:'Rerank 重排序',e:'Reranking',p:'l',
 s:'RAG 检索时先用向量粗筛出几十段，再用专门的模型精选出最相关的几段。',
 d:['向量检索速度快，但精度有限：它是把问题和文档分别变成向量再比较，两者没有"一起被阅读"。重排序模型则同时读入问题和每一段候选文档，判断它们的相关程度，精度高得多，但速度较慢。',
 '所以常见的两段式做法是：先用向量检索快速召回 20 到 50 段候选，再用重排序模型给这些候选打分，只把前 3 到 5 段放进上下文。',
 '这样既保证了速度，又提升了最终放进上下文的资料质量，同时也缓解了"迷失在中间"的问题。'],
 a:'招聘时先用简历关键词筛出 50 人（向量检索），再由面试官逐个面谈挑出 5 人（重排序）。',
 t:['RAG 准确率不够时，加重排序通常是性价比很高的优化。'],
 r:['rag','vectordb','lostmid']},
choose:{g:'app',n:'提示词 vs RAG vs 微调',e:'Prompting vs RAG vs Fine-tuning',p:'m',
 s:'想让模型适配你的业务时，通常按"提示词 → RAG → 微调"的顺序尝试。',
 d:['三者解决的问题不同。提示词：告诉模型怎么做，成本最低、改起来最快。RAG：给模型补充它不知道的知识，适合大量、经常变化的资料。微调：改变模型的行为习惯，比如固定的输出风格、特殊格式、某个专门任务的处理方式。',
 '常见误区是一上来就想微调，以为这样模型就"学会"了公司的知识。实际上微调灌输知识的效果不稳定，资料一更新就要重新训练，还可能引发幻觉，而 RAG 改一下文档就能生效。',
 '它们也可以组合：用提示词定义规则，用 RAG 提供资料，必要时再微调来固定风格或降低成本（比如把大模型的效果微调到一个小模型上）。'],
 f:`<div class="tbl"><table class="cmp"><thead><tr><th></th><th>提示词</th><th>RAG</th><th>微调</th></tr></thead><tbody>
<tr><td>解决什么</td><td>怎么做</td><td>知道什么</td><td>习惯怎么做</td></tr>
<tr><td>成本</td><td>很低</td><td>中等</td><td>较高</td></tr>
<tr><td>更新速度</td><td>立即</td><td>改文档即可</td><td>需重新训练</td></tr>
<tr><td>适合</td><td>规则、格式、语气</td><td>私有文档、最新信息</td><td>固定风格、专门任务</td></tr>
</tbody></table></div>`,
 a:'提示词是工作交代，RAG 是给员工一份参考资料，微调是送员工去培训一段时间改变习惯。',
 t:['先用提示词把效果做到天花板，再判断是否真的需要另外两种。'],
 r:['prompt','rag','finetune']},
ctxeng:{g:'app',n:'上下文工程',e:'Context Engineering',p:'h',
 s:'决定在什么时候、把什么信息、以什么方式放进模型上下文窗口的整套方法。',
 d:['提示词工程关注"一段指令怎么写"。随着应用变得复杂，尤其是 Agent 要运行很多步，问题变成了：上下文这块有限的空间里，每一步应该放什么？这就是上下文工程。',
 '上下文里可能包含：System Prompt、工具说明、Skill、Memory 中的长期信息、RAG 检索结果、对话历史、工具返回结果。每一项都在抢占空间，放太少模型缺信息，放太多模型被干扰、成本上升、中间内容被忽略。',
 '常用策略：按需加载（Skill、工具说明只在需要时放入完整内容）；压缩（对话太长时总结旧内容）；外部化（把进度、笔记写进文件，需要时再读）；隔离（让子 Agent 在独立上下文里处理大量资料，只带回结论）；检索（用 RAG 只拿最相关的部分）。'],
 a:'给一位顾问准备会议材料：材料太少他无从判断，一次塞给他三百页他又找不到重点，关键是精选和排序。',
 t:['Agent 效果不好时，先打印出它每一步实际看到的完整上下文，问题常常一目了然。'],
 r:['context','compact','memory','skill','subagent','rag']},
compact:{g:'app',n:'上下文压缩',e:'Compaction',p:'m',
 s:'对话快要超出窗口时，让模型把旧内容总结成摘要，替换掉原文继续对话。',
 d:['当上下文接近上限时，系统会让模型阅读较早的对话，按照指令写一份摘要，然后用"摘要 + 最近的原文"替代完整历史，继续对话。具体实现各家不同，细节也不完全公开，但思路相似。',
 '通常的取舍是：系统指令原样保留；最近几轮对话原样保留，因为正在进行的事情最需要细节；用户目标、已做出的决定、明确提出的偏好、任务进度和待办，提炼进摘要；工具的大段输出（日志、读过的文件全文）、已解决的中间过程、闲聊优先丢弃，需要时可以重新读取。',
 '压缩本质上是有损的。如果模型判断失误，把你认为重要的细节当成了不重要的，压缩之后它就真的不知道了。'],
 a:'会议记录员把三小时的讨论整理成一页纪要：结论和待办都在，但谁在第几分钟说了什么已经没了。',
 t:['长任务中，把关键信息写进文件（进度笔记、决策记录），比只放在对话里可靠得多。','压缩后发现模型"忘了"某个要求，可以直接再告诉它一次。'],
 r:['context','ctxeng','memory']},
evals:{g:'app',n:'评测',e:'Evals',p:'h',
 s:'准备一批测试问题和评判标准，每次修改后跑一遍，用数据判断效果是变好还是变坏。',
 d:['AI 应用的输出不确定，改了一句提示词，可能修好了一个问题，同时弄坏了另外三个。如果没有评测，所有优化都只能凭感觉。评测就是 AI 应用的"单元测试 + 回归测试"。',
 '一套评测通常包括：测试用例集（覆盖常见场景、边界情况、曾经出过错的案例）；评判方式；以及每次改动后的对比报告。',
 '评判方式有三种：代码判断（输出是否是合法 JSON、是否包含某个关键词、数值是否正确）；人工评判（最准确，但慢且贵）；用另一个模型当评委（LLM-as-a-Judge，按评分标准打分，速度快，但要先抽查验证它判得准不准）。',
 '从小做起就有价值：哪怕只有 20 个用例和一个简单脚本，也比完全没有强得多。'],
 a:'做菜换了一种调料，要请几个人试吃同一批菜打分，而不是自己尝一口就说"好像好吃了"。',
 t:['用户反馈的每一个错误案例，都应该加进评测集。','换模型、升级模型版本之前，先跑一遍评测。'],
 r:['prompt','split','reward','hallucination']},

// ───── Agent
agent:{g:'agent',n:'Agent 智能体',e:'AI Agent',p:'h',
 s:'模型 + 工具 + 循环：能接受一个目标，自己规划、调用工具、观察结果，直到完成任务。',
 d:['大模型本身只能输入文字、输出文字。Agent 给它配上工具（搜索、读写文件、执行代码、调用 API），并让它在一个循环里工作：思考下一步做什么 → 调用工具 → 观察结果 → 再思考，直到任务完成或需要人来决定。',
 '这个循环通常被称为 ReAct（Reasoning + Acting，推理 + 行动）模式。和普通聊天的关键区别是：Agent 自己决定步骤和顺序，而不是每一步都由人或代码规定好。',
 '要区分"工作流"和"Agent"：工作流是开发者预先写好固定步骤（先检索、再总结、再翻译），模型只负责每一步的内容；Agent 是模型自己决定走哪些步骤。工作流更可控、更便宜，Agent 更灵活。很多实际产品是两者的混合。',
 'Claude、ChatGPT 这些名字既指模型也指产品。产品层面它们都配备了工具，执行任务时就是以 Agent 的方式在工作。Claude Code 这类编程助手是典型的 Agent：读代码、改代码、运行测试、根据报错继续修改。'],
 a:'模型是一个聪明但被关在房间里、只能传纸条的人；Agent 是给他配了电脑、电话和工作手册，让他自己去查、去做、去验证。',
 t:['能用固定工作流解决的问题，先别上 Agent，可控性和成本都更好。','Agent 的每一步都会重新发送整个上下文，步骤多时成本增长很快。','让 Agent 执行有副作用的操作（删除、付款、发送邮件）前，设计人工确认环节。'],
 r:['tool','mcp','skill','memory','subagent','langgraph']},
tool:{g:'agent',n:'Tool 工具调用',e:'Tool Use / Function Calling',p:'h',
 s:'模型输出"要调用哪个函数、传什么参数"，由外部程序真正执行，再把结果返回给模型。',
 d:['模型本身不能执行任何代码。工具调用的机制是：开发者先告诉模型有哪些工具可用，每个工具包括名称、用途描述、参数格式（JSON Schema）。模型在回答过程中如果判断需要某个工具，就输出一段结构化的调用请求，比如 get_weather(city="东京")。',
 '你的程序收到这个请求后，真正去执行这个函数（调用天气 API），再把结果作为一条新消息发回给模型。模型读到结果后，继续回答或者决定调用下一个工具。',
 '工具描述写得好不好直接影响效果：模型完全依靠描述来判断什么时候用、怎么用这个工具。描述要说清楚用途、什么时候该用、什么时候不该用、每个参数的含义和格式。'],
 a:'模型像一个只能打电话下指令的经理：他说"帮我查一下明天的天气"，助理（你的代码）去查，查完把结果报告给他。',
 t:['工具就是你写的普通函数加一段描述，Python 开发者上手很快。','工具返回的内容会进入上下文，返回太长会浪费 Token，必要时先截断或总结。','把工具的执行结果当作不可信数据，它可能包含提示注入。'],
 c:`# 工具定义（发给模型的描述）
tools = [{
  "name": "get_weather",
  "description": "查询指定城市未来几天的天气。用户问到天气时使用。",
  "input_schema": {
    "type": "object",
    "properties": {"city": {"type": "string", "description": "城市名，如 东京"}},
    "required": ["city"]
  }
}]

# 循环：模型要求调用工具 → 你执行 → 把结果发回去
while True:
    resp = call_model(messages, tools)
    if resp.wants_tool:
        result = get_weather(**resp.tool_args)   # 你的代码真正执行
        messages += [resp.message, tool_result(result)]
    else:
        print(resp.text); break`,
 r:['agent','mcp','structured','safety_inject']},
mcp:{g:'agent',n:'MCP 模型上下文协议',e:'Model Context Protocol',p:'h',
 s:'Anthropic 在 2024 年发布的开放协议，统一规定 AI 应用如何连接外部工具和数据。',
 d:['没有 MCP 之前，每个 AI 应用要接入 GitHub、数据库、Slack 等服务，都得各自写一遍对接代码。N 个 AI 应用乘以 M 个服务，就要写 N×M 份集成。',
 'MCP 定义了一套标准的对接方式：服务方写一个 MCP Server，按协议暴露自己的能力；任何支持 MCP 的 AI 应用（MCP Client）都能直接连接使用。这样只需要 N+M 份工作。',
 '一个 MCP Server 主要可以提供三类东西：Tools（可调用的函数，如"创建 Issue"）、Resources（可读取的数据，如文件、数据库记录）、Prompts（预设的提示词模板）。通信基于 JSON-RPC，可以在本地运行（通过标准输入输出），也可以作为远程服务（通过 HTTP）。',
 'MCP 发布后被众多 AI 产品和开发工具采纳，已经成为连接 AI 和外部系统事实上的通用标准之一。'],
 a:'AI 世界的 USB-C 接口：以前每种设备一种充电线，现在一个统一接口，什么设备都能插。',
 t:['写 MCP Server 门槛很低，Python 有官方 SDK，几十行就能把你的一组函数暴露出去。','接入第三方 MCP Server 要注意安全：它能看到 Agent 传过去的数据，返回的内容也可能包含提示注入。'],
 c:`# Python 官方 SDK 写一个最小 MCP Server（示意）
from mcp.server.fastmcp import FastMCP

mcp = FastMCP("menu-tools")

@mcp.tool()
def count_menus(env: str) -> int:
    """统计指定环境（dev/test/prod）的菜单数量"""
    return query_db(env)

if __name__ == "__main__":
    mcp.run()`,
 r:['tool','skill','agent','safety_inject']},
skill:{g:'agent',n:'Skill 技能',e:'Agent Skills',p:'m',
 s:'一个装着"做某类事情的方法说明"和相关脚本的文件夹，Agent 遇到相关任务时才去读取。',
 d:['Skill 通常是一个文件夹，核心是一份 SKILL.md：开头有名称和简短描述，正文写着具体做法、注意事项、示例；文件夹里还可以放脚本、模板、参考资料。',
 '它的关键设计是"渐进加载"：平时上下文里只放每个 Skill 的名称和一句话描述，占用很少空间。当任务和某个 Skill 相关时，Agent 才读取完整的 SKILL.md，必要时再运行里面的脚本。这样可以给 Agent 装上很多 Skill，而不会把上下文塞满。',
 '和 MCP 的区别：MCP 提供的是"能力"，让 Agent 能连接到某个系统；Skill 提供的是"方法"，告诉 Agent 怎么把一件事做好。比如接上 PostgreSQL 的 MCP，Agent 就能查数据库；再加一个"我们团队的 SQL 规范"Skill，它查询时就会遵循你们的规范。两者经常配合使用。'],
 a:'MCP 是给员工配的工具和权限，Skill 是部门的操作手册，员工遇到对应任务时才翻开那一章。',
 t:['团队里反复解释的流程、规范、模板，都适合写成 Skill。','Skill 的描述决定了 Agent 什么时候会想起它，要写清楚适用场景。'],
 r:['mcp','ctxeng','agent','memory']},
memory:{g:'agent',n:'Memory 记忆',e:'Memory',p:'m',
 s:'把重要信息存到对话之外，下次需要时再放进上下文，让 AI 能"记住"跨对话的内容。',
 d:['模型权重在使用中不会改变，上下文在对话结束后也就没了，所以模型本身不会记住你。产品里的"记忆"功能都是外部机制：把值得长期保存的信息（你的偏好、项目背景、做过的决定）写进文件或数据库，在之后的对话中按需读取，放进上下文。',
 '常见的实现方式：一份简单的文本文件（每次对话开头读入）；按主题组织的多个文件，按需读取；用向量数据库存储，用检索的方式找到相关记忆（本质上就是对历史信息做 RAG）。',
 '记忆系统的难点在于"记什么"和"何时用"：记太多会干扰判断、浪费上下文；记错了会一直带着错误；在无关的场景里突然提起旧信息，体验也不好。还要考虑隐私：哪些信息不应该被保存。'],
 a:'模型像一个每天早上都会失忆的人，记忆功能就是他床头的笔记本：每天醒来先翻一翻，就知道之前发生过什么。',
 t:['Agent 执行长任务时，让它把进度写进一个笔记文件，是最简单有效的"记忆"。','和压缩的区别：压缩解决"当前对话装不下"，记忆解决"跨对话记不住"。'],
 r:['context','compact','ctxeng','rag']},
subagent:{g:'agent',n:'Subagent 子智能体',e:'Subagent / Multi-agent',p:'l',
 s:'主 Agent 把一部分任务交给另一个拥有独立上下文的 Agent 完成，只把结果拿回来。',
 d:['有些任务会产生大量中间信息，比如翻阅一百个文件寻找某个线索。如果主 Agent 亲自做，这些文件内容会塞满它的上下文。交给子 Agent 去做，子 Agent 在自己的上下文里完成翻找，最后只把"在第几个文件找到了什么"这个结论交回来。',
 '子 Agent 的另一个用途是并行：同时派出几个子 Agent 分别调研不同方向，再由主 Agent 汇总。',
 '更广义的"多智能体系统"会让多个不同角色的 Agent 协作，比如一个负责规划、一个负责写代码、一个负责审查。多 Agent 更强大，但也更难调试、成本更高、Agent 之间的信息传递可能出现偏差。'],
 a:'项目经理把"查遍所有历史合同"这件事派给实习生，实习生翻完后只汇报一页结论，经理的办公桌不会被堆满。',
 t:['先用单个 Agent，确实遇到上下文不够或需要并行时再引入子 Agent。'],
 r:['agent','ctxeng','langgraph']},

// ───── 框架
langchain:{g:'frame',n:'LangChain',e:'LangChain',p:'m',
 s:'最流行的开源大模型应用框架之一，提供统一的模型接口、大量集成，以及快速搭建 Agent 的高层 API。',
 d:['LangChain 由 LangChain 公司开发，有 Python 和 JavaScript 两个版本。它要解决的问题是：不同模型厂商的 API 各不相同，而 RAG、工具调用、Agent 这些常见模式每次都要从头写。LangChain 把它们封装成统一的接口和现成组件。',
 '它最核心的价值有两块。一是集成：提供上千种对接，包括各家模型（Anthropic、OpenAI、Google 等）、嵌入模型、向量数据库、文档加载器，换模型往往只需要改一行配置。二是 Agent 抽象：2025 年 10 月发布的 LangChain 1.0 把重心放在 create_agent 这个函数上，几行代码就能创建一个带工具的 Agent，底层运行在 LangGraph 之上；还引入了中间件（Middleware）机制，可以在 Agent 循环的各个环节插入自定义逻辑，比如压缩对话、人工审批、限制调用次数。',
 '历史上 LangChain 以"链"（Chain）著称，用 LCEL 语法把提示词、模型、解析器串起来。早期版本因为抽象层次太多、学习成本高、调试困难而受到不少批评，1.0 大幅精简了核心包，旧的接口被移到 langchain-classic 包中。',
 '和它配套的还有 LangSmith：一个用于追踪每次调用细节、调试和做评测的平台（商业服务，有免费额度）。'],

 c:`from typing import TypedDict
from langgraph.graph import StateGraph, START, END

class State(TypedDict):
    question: str
    docs: list[str]
    answer: str

def retrieve(s: State):  return {"docs": search(s["question"]), "retries": s["retries"] + 1}
def generate(s: State):  return {"answer": llm(s["question"], s["docs"])}
def check(s: State):     return "ok" if good(s["answer"]) or s["retries"] >= 3 else "retry"

g = StateGraph(State)
g.add_node("retrieve", retrieve)
g.add_node("generate", generate)
g.add_edge(START, "retrieve")
g.add_edge("retrieve", "generate")
g.add_conditional_edges("generate", check, {"ok": END, "retry": "retrieve"})

let timers=[];
const every=(fn,ms)=>{const t=setInterval(fn,ms);timers.push(t);return t};
const after=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t};
const clearTimers=()=>{timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[]};
const W=(el,h)=>{el.innerHTML=h;return s=>el.querySelector(s)};

<svg viewBox="0 0 520 240" class="vsvg"><line x1="40" y1="210" x2="500" y2="210" class="sl"/><line x1="40" y1="20" x2="40" y2="210" class="sl"/><text x="500" y="230" text-anchor="end" class="tm">房屋面积（输入）</text><text x="46" y="30" class="tm">价格（答案）</text><g id="er"></g><g id="pt"></g><line id="ln" class="sa" stroke-width="3" stroke-linecap="round"/></svg>
<p class="vnote">点是真实数据（题目 + 答案），线是模型的猜测，虚线是每个点的误差。每训练一步，模型就把它仅有的两个参数往误差变小的方向调一点。学到的规律：<b id="rule"></b></p>`);
const D=[[.08,.15],[.18,.22],[.25,.35],[.35,.38],[.42,.5],[.5,.52],[.58,.62],[.66,.66],[.74,.78],[.82,.8],[.9,.92]];
const X=v=>40+v*460,Y=v=>210-v*180,cl=v=>Math.max(-.1,Math.min(1.1,v));
$('#pt').innerHTML=D.map(d=>`<circle cx="${X(d[0])}" cy="${Y(d[1])}" r="5" class="fb"/>`).join('');
let w,b,ep,t=null;
function draw(){const l=$('#ln');l.setAttribute('x1',X(0));l.setAttribute('y1',Y(cl(b)));l.setAttribute('x2',X(1));l.setAttribute('y2',Y(cl(w+b)));
$('#er').innerHTML=D.map(d=>`<line x1="${X(d[0])}" x2="${X(d[0])}" y1="${Y(d[1])}" y2="${Y(cl(w*d[0]+b))}" class="sm" stroke-dasharray="3 3"/>`).join('');
$('#ep').textContent=ep;$('#ls').textContent=(D.reduce((s,d)=>s+(w*d[0]+b-d[1])**2,0)/D.length*100).toFixed(2);$('#rule').textContent=`价格 ≈ ${w.toFixed(2)} × 面积 + ${b.toFixed(2)}`}
function step(){let gw=0,gb=0;D.forEach(d=>{const e=w*d[0]+b-d[1];gw+=e*d[0];gb+=e});w-=2.4*gw/D.length;b-=2.4*gb/D.length;ep++;draw()}
function stop(){if(t){clearInterval(t);t=null;$('[data-a=auto]').textContent='自动训练'}}
el.onclick=e=>{const a=e.target.dataset.a;if(a==='step'){stop();step()}if(a==='reset'){stop();w=-.6;b=.85;ep=0;draw()}if(a==='auto'){if(t)return stop();t=every(()=>{step();if(ep>=150)stop()},60);e.target.textContent='暂停'}};

el.onclick=e=>{if(e.target.dataset.a!=='go')return;clearTimers();const s={...st,docs:[]};show(s);
steps.forEach(([id,up,ch,note],i)=>after(()=>{el.querySelectorAll('.lit').forEach(x=>x.classList.remove('lit'));const n=$('#g-'+id)||$('#'+id);if(n)n.classList.add('lit');if(up)Object.assign(s,up);show(s,ch);if(note)$('#lt').textContent=note},i*800))};show(st)};

el.onclick=e=>{const m=e.target.dataset.m;if(m===undefined)return;clearTimers();el.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('is',b.dataset.m===m));$('#sl').innerHTML='';
S[m].forEach(([t,x,c],i)=>after(()=>$('#sl').insertAdjacentHTML('beforeend',`<div class="li"><span class="tag" ${c?`style="--tc:var(${c})"`:''}>${t}</span><span>${x}</span></div>`),i*650))}};

/* ───── 渲染 */
const ids=Object.keys(C);
const gColor=g=>`var(${GROUPS.find(x=>x.id===g).color})`;
let cur=null,stageFilter=null,query='';
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=new Set(store.get('aih-done',[]));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function renderFlow(){
  const f=document.getElementById('flow');
  f.innerHTML=STAGES.map((s,i)=>`${i&&i<STAGES.length-1?'<span class="ar" aria-hidden="true">→</span>':i===STAGES.length-1?'<span class="ar" aria-hidden="true">·</span>':''}<button class="st${stageFilter===i?' on':''}" style="--sc:var(${s.c})" data-i="${i}" aria-pressed="${stageFilter===i}"><b>${s.name}</b><span>${s.desc}</span></button>`).join('');
  f.querySelectorAll('.st').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;stageFilter=stageFilter===i?null:i;renderFlow();renderGroups();});
}
function match(k){
  const c=C[k];
  if(stageFilter!==null&&!STAGES[stageFilter].g.includes(c.g))return false;
  if(!query)return true;
  const q=query.toLowerCase();
  return (c.n+c.e+c.s).toLowerCase().includes(q);
}
function renderGroups(){
  const box=document.getElementById('groups');let html='',any=false;
  for(const g of GROUPS){
    const ks=ids.filter(k=>C[k].g===g.id&&match(k));if(!ks.length)continue;any=true;
    html+=`<section class="grp" style="--gc:var(${g.color})"><div class="grp-h"><h2>${g.name}</h2><small>${g.sub} · ${ks.length}</small></div><div class="chips">`+
    ks.map(k=>`<button class="chip${k===cur?' on':''}${done.has(k)?' done':''}" data-k="${k}"><i class="pr ${C[k].p}"></i>${C[k].n}${VIZ[k]?'<span class="anim" title="有动画演示">▶</span>':''}</button>`).join('')+`</div></section>`;
  }
  box.innerHTML=any?html:'<div class="empty">没有找到匹配的概念，换个关键词试试。</div>';
  box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>open(b.dataset.k,true));
  renderProg();
}
function renderProg(){
  document.getElementById('ptxt').textContent=`${done.size} / ${ids.length}`;
  document.getElementById('pbar').style.width=(done.size/ids.length*100)+'%';
}
function open(k,scroll){
  if(!C[k])return;cur=k;const c=C[k],g=GROUPS.find(x=>x.id===c.g);
  const peers=ids.filter(x=>C[x].g===c.g),pi=peers.indexOf(k);
  const prev=peers[pi-1],next=peers[pi+1];
  const pl={h:'开发者必知',m:'很常见，要懂',l:'了解即可'}[c.p];
  const d=document.getElementById('detail');d.style.setProperty('--dc',gColor(c.g));
  clearTimers();
  d.innerHTML=`<div class="kick">${g.name} · ${pl}</div><h2>${c.n}</h2><div class="en">${c.e}</div>
  <p class="lead">${c.s}</p>
  ${VIZ[k]?'<h3>动画演示</h3><div class="vz" id="viz"></div>':''}
  <h3>详细讲解</h3>${c.d.map(p=>`<p>${p}</p>`).join('')}
  ${c.f&&!VIZ[k]?`<h3>图解</h3>${c.f}`:''}
  ${c.a?`<h3>打个比方</h3><div class="analogy">${c.a}</div>`:''}
  ${c.t?`<h3>开发者要注意</h3><ul>${c.t.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
  ${c.c?`<h3>代码示例</h3><pre><code>${esc(c.c)}</code></pre>`:''}
  ${c.r?`<h3>相关概念</h3><div class="rel">${c.r.filter(x=>C[x]).map(x=>`<button data-k="${x}">${C[x].n}</button>`).join('')}</div>`:''}
  <div class="dfoot"><div class="nav">${prev?`<button class="btn" data-k="${prev}">← ${C[prev].n}</button>`:''}${next?`<button class="btn" data-k="${next}">${C[next].n} →</button>`:''}</div>
  <button class="btn ok${done.has(k)?' is':''}" id="mark">${done.has(k)?'已掌握 ✓':'标记为已掌握'}</button></div>`;
  if(VIZ[k]){try{VIZ[k](document.getElementById('viz'))}catch(err){document.getElementById('viz').textContent='动画加载失败：'+err.message}}
  d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>open(b.dataset.k,true));
  document.getElementById('mark').onclick=()=>{done.has(k)?done.delete(k):done.add(k);store.set('aih-done',[...done]);open(k,false);};
  d.scrollTop=0;
  if(scroll&&window.matchMedia('(max-width:900px)').matches)d.scrollIntoView({behavior:'smooth',block:'start'});
  store.set('aih-cur',k);
  try{history.replaceState(null,'','#'+k)}catch(e){}
  renderGroups();
}
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim();renderGroups();});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('q').focus();}});
renderFlow();
const h=location.hash.slice(1);
open(C[h]?h:(C[store.get('aih-cur','')]?store.get('aih-cur',''):'transformer'),false);
</script>
